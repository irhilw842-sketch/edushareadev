<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - EduShare</title>
    <link rel="icon" type="image/svg+xml" href="../data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../firebase.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>EduShare</span>
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="matieres.html">Matières</a></li>
                <li><a href="apropos.html">À propos</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="connexion.html" class="btn btn-primary btn-sm active">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div style="text-align: center; margin-bottom: 8px;">
                    <i class="fas fa-shield-alt" style="font-size: 2.4rem; color: var(--primary);"></i>
                </div>
                <h2 style="text-align: center;">Connexion Administrateur</h2>
                <p class="subtitle" style="text-align: center;">Accès réservé aux administrateurs des matières</p>
                <div id="loginError" style="display: none; padding: 12px 16px; background: #FEE2E2; color: #DC2626; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem; font-weight: 500;"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email administrateur</label>
                        <input type="email" id="email" placeholder="admin@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                </form>
                <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
                    <p style="font-size: 0.85rem; color: var(--text-light); text-align: center;">
                        <i class="fas fa-info-circle"></i>
                        Cette plateforme est réservée aux administrateurs.<br>
                        Les comptes sont créés manuellement dans Firebase.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');

        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

        const result = await signInAdmin(email, password);

        if (result.success) {
            btn.innerHTML = '<i class="fas fa-check"></i> Redirection...';
            window.location.href = result.adminData.subject
                ? `admin/${result.adminData.subject}.html`
                : '../index.html';
        } else {
            errorEl.textContent = result.error;
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
        }
    });
    </script>
</body>
</html>
